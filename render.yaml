# Render Blueprint: PostgreSQL + Key Value (Redis) + API + static frontend.
# Region: Singapore for the database, Redis and API (they must share a region to talk privately).
# The static frontend is served from Render's global CDN and has no region.
# Dashboard -> Blueprints -> New Blueprint Instance -> select this repo.

databases:
  - name: database
    plan: free
    region: singapore
    databaseName: pos_db

services:
  - type: keyvalue
    name: redis
    plan: free
    region: singapore
    # Never evict: dropping token-blacklist keys would revive logged-out tokens. When full, cache
    # writes fail and the API falls back to Postgres.
    maxmemoryPolicy: noeviction
    # Empty allow list = reachable only from services inside this Render account (not the internet).
    ipAllowList: []

  - type: web
    name: pos-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: source/backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    # Free tier has no pre-deploy hook: apply migrations (idempotent) and the idempotent demo seed on boot.
    startCommand: node dist/shared/db/migrate.js && node dist/scripts/seed.js && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render terminates TLS at one proxy hop; needed for correct client IPs in rate limiting.
      - key: TRUST_PROXY
        value: "1"
      - key: API_DOCS
        value: "true"
      # Set to the frontend URL (e.g. https://pos-frontend.onrender.com). Empty allows any origin.
      - key: CORS_ORIGINS
        sync: false
      # Demo users' password: random, never in the repo. Read it in Render (pos-backend -> Environment)
      # and share it with reviewers privately.
      - key: SEED_PASSWORD
        generateValue: true

  - type: web
    name: pos-frontend
    runtime: static
    rootDir: source/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pos-backend
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
