name: pos-system

# App services only. Postgres and Redis are the shared ones on the external `common-net` network
# (reachable as `postgres` and `redis`), configured in orchestrate/backend/.envs/app.env.
#
#   cp orchestrate/backend/.envs/app.env.example orchestrate/backend/.envs/app.env   # once, then edit
#   docker compose -f orchestrate/compose.yml up --build -d                          # migrate + api + web
#   docker compose -f orchestrate/compose.yml --profile db-job run --rm seed         # demo data (optional)
#
# No shared Postgres/Redis on this machine? Start the bundled ones first:
#   docker network create common-net
#   docker compose -f orchestrate/compose.infra.yml up -d
#
# App: http://localhost:8080   API: http://localhost:3000/api   Docs: http://localhost:3000/docs

x-backend: &backend
  build:
    context: ..
    dockerfile: orchestrate/backend/Dockerfile
  image: pos-backend:local
  env_file:
    - ./backend/.envs/app.env

services:
  # Applies pending migrations, then exits. The API starts only after it succeeds.
  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"

  seed:
    <<: *backend
    command: ["seed"]
    restart: "no"
    profiles: ["db-job"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    <<: *backend
    command: ["start"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: orchestrate/frontend/Dockerfile
    image: pos-frontend:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: common-net
    external: true
